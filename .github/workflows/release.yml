name: Release

# Pushing a tag such as v3.2 builds, tests and signs the APK, then creates a DRAFT GitHub release.
# The app only installs published releases, so phones see the update after you click Publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate (CN=Second Brain Release), read from the published v3.1.2 APK.
  # Phones refuse updates signed by any other key, so the workflow refuses to publish them too.
  RELEASE_CERT_SHA256: 2793a9d410babc74ed9e662e244fb0b45f005660d62e966df319242a8cddc8a9

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the app version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          name=$(sed -nE 's/^val appVersionName = releaseVersion \?: "([0-9.]+)"$/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^val appVersionCode = \(releaseCode \?: "([0-9]+)"\)\.toInt\(\)$/\1/p' app/build.gradle.kts)
          if [ -z "$name" ] || [ -z "$code" ]; then echo "::error::Couldn't read the version from app/build.gradle.kts"; exit 1; fi
          if [ "$tag" != "v$name" ]; then echo "::error::Tag $tag doesn't match app version $name. Bump the version first."; exit 1; fi
          if [ ! -s "release-notes/$tag.md" ]; then echo "::error::Add release notes in release-notes/$tag.md"; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the SB_RELEASE_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Test and build signed APK
        env:
          SB_RELEASE_KEYSTORE: ${{ runner.temp }}/release.p12
          SB_RELEASE_STORE_PASSWORD: ${{ secrets.SB_RELEASE_STORE_PASSWORD }}
          SB_RELEASE_KEY_ALIAS: ${{ secrets.SB_RELEASE_KEY_ALIAS }}
          SB_RELEASE_KEY_PASSWORD: ${{ secrets.SB_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          signer=$("$ANDROID_HOME/build-tools/$tools/apksigner" verify --print-certs "$apk" \
            | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p')
          if [ "$signer" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::APK is signed by $signer, not the release key. Phones would refuse this update."; exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/second-brain-$tag.apk"
          (cd dist && sha256sum "second-brain-$tag.apk" > "second-brain-$tag.apk.sha256")
          gh release create "$tag" dist/* --draft --verify-tag \
            --title "Second Brain $NAME" --notes-file "release-notes/$tag.md"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
